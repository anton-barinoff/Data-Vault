services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.6
    container_name: clickhouse-dv
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    environment:
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    restart: unless-stopped
volumes:
  clickhouse_data: